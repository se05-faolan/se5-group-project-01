<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Section</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to right, #2563eb, #06b6d4);
      padding: 20px;
    }

    .container {
      width: 390px;
      background: transparent;
      border-radius: 20px;
      padding: 30px 20px;
      color: #f8fafc;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #ffffff;
    }

    .form-group {
      margin-bottom: 15px;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: none;
      font-size: 14px;
      outline: none;
      background: #ffffff;
      color: #1e293b;
    }

    textarea {
      resize: none;
      height: 100px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #1e293b;
      color: #ffffff;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #0f172a;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Contact Us</h2>

    <div class="form-group">
      <input type="text" placeholder="Name">
    </div>

    <div class="form-group">
      <input type="email" placeholder="Email">
    </div>

    <div class="form-group">
      <textarea placeholder="Message"></textarea>
    </div>

    <button>Send</button>
  </div>
</body>
</html>
